<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>PhicommM1</title>
    <meta name="viewport"
        content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no" />
    <link rel="stylesheet" type="text/css" href="{{ url_for('static',filename='css/iconfont.css') }}" />
    <link rel="stylesheet" type="text/css" href="{{ url_for('static',filename='css/style.css') }}" />
    <script src="{{ url_for('static',filename='js/flexible.js') }}" type="text/javascript" charset="utf-8"></script>
    <script src="{{ url_for('static',filename='js/vue.min.js') }}" type="text/javascript" charset="utf-8"></script>
    <script src="{{ url_for('static',filename='js/echarts.min.js') }}" type="text/javascript" charset="utf-8"></script>
    <script src="{{ url_for('static',filename='js/layer_mobile/layer.js') }}" type="text/javascript" charset="utf-8"></script>
    <script src="https://cdn.staticfile.org/jquery/1.10.2/jquery.min.js"></script>
    <style>
        .brightness-panel {
            width: 100%;
            margin-top: .3rem;
            padding: .3rem;
            background: #F6FBF4;
            border-radius: .15rem;
            box-shadow: 0 0 2rem rgba(0, 0, 0, .1);
        }
        .brightness-panel .panel-title {
            font-size: .26rem;
            color: #8a8a8a;
            margin-bottom: .2rem;
            display: flex;
            align-items: center;
        }
        .brightness-panel .panel-title::before {
            content: "";
            display: inline-block;
            width: .08rem;
            height: .28rem;
            background: #76BA99;
            margin-right: .12rem;
            border-radius: .04rem;
        }
        .brightness-buttons {
            display: flex;
            gap: .2rem;
        }
        .brightness-buttons button {
            flex: 1;
            height: .7rem;
            border: .02rem solid #76BA99;
            border-radius: .35rem;
            background: #fff;
            color: #76BA99;
            font-size: .26rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        .brightness-buttons button.active {
            background: #76BA99;
            color: #fff;
        }
        .range-selector {
            display: flex;
            gap: .15rem;
            margin-top: .3rem;
        }
        .range-selector button {
            flex: 1;
            height: .55rem;
            border: .02rem solid #ddd;
            border-radius: .3rem;
            background: #fff;
            color: #8a8a8a;
            font-size: .24rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        .range-selector button.active {
            border-color: #76BA99;
            color: #76BA99;
            background: #F6FBF4;
        }
        .chart .type span {
            cursor: pointer;
        }
        .chart .type span.on {
            color: #76BA99;
        }
        .loading-hint {
            text-align: center;
            color: #adadad;
            font-size: .24rem;
            padding: .5rem 0;
        }
    </style>
</head>

<body>
    <div id="app">
        <div class="top-bg"></div>
        <div class="top-bar">
            <span style="width:100%;text-align:center;">M1空气质量监测</span>
        </div>
        <div class="container">
            <div class="account">
                <img src="{{ url_for('static',filename='images/head-face.png') }}" alt="">
                <div class="name">
                    <p>悟空M1</p>
                    <span>客厅</span>
                </div>
            </div>

            <!-- 信息面板 -->
            <div class="info-panel">
                <ul>
                    <li>
                        <p><i class="iconfont icon-wendu"></i>温度</p>
                        <span id="info_temperature">{{ info_temperature }}</span><a>°C</a>
                    </li>
                    <li>
                        <p><i class="iconfont icon-youzhi"></i>湿度</p>
                        <span id="info_humidity">{{ info_humidity }}</span><a>%</a>
                    </li>
                    <li>
                        <p><i class="iconfont icon-jiaquan"></i>PM2.5</p>
                        <span id="info_pm25">{{ info_pm25 }}</span><a>μg/m³</a>
                    </li>
                    <li>
                        <p><i class="iconfont icon-jiachun"></i>甲醛</p>
                        <span id="info_hcho">{{ info_hcho }}</span><a>mg/m³</a>
                    </li>
                </ul>
            </div>

            <!-- 亮度控制 -->
            <div class="brightness-panel">
                <div class="panel-title">屏幕亮度</div>
                <div class="brightness-buttons">
                    <button id="btn_bright_0" class="{% if info_brightness == 0 %}active{% endif %}"
                        onclick="setBrightness(0)">关闭</button>
                    <button id="btn_bright_25" class="{% if info_brightness == 25 %}active{% endif %}"
                        onclick="setBrightness(25)">暗</button>
                    <button id="btn_bright_50" class="{% if info_brightness == 50 %}active{% endif %}"
                        onclick="setBrightness(50)">标准</button>
                </div>
            </div>

            <!-- 图表 -->
            <div class="chart">
                <div id="info_time" class="now">{{ info_time }}</div>
                <div class="type">
                    <span id="tab_temp" class="on" onclick="switchMetric('temperature')">温度</span>
                    <span id="tab_hum" onclick="switchMetric('humidity')">湿度</span>
                    <span id="tab_pm25" onclick="switchMetric('pm25')">PM2.5</span>
                    <span id="tab_hcho" onclick="switchMetric('hcho')">甲醛</span>
                </div>
                <div id="chart"></div>
                <div class="range-selector">
                    <button data-hours="1" onclick="loadHistory(1)">1小时</button>
                    <button data-hours="6" onclick="loadHistory(6)">6小时</button>
                    <button data-hours="24" class="active" onclick="loadHistory(24)">24小时</button>
                    <button data-hours="168" onclick="loadHistory(168)">7天</button>
                </div>
            </div>

        </div>
    </div>

    <script>
        var chart = null;
        var currentMetric = 'temperature';
        var currentHours = 24;
        var historyData = [];

        var metricConfig = {
            temperature: { name: '温度', color: '#76BA99', unit: '°C', field: 'temperature' },
            humidity: { name: '湿度', color: '#92a9f9', unit: '%', field: 'humidity' },
            pm25: { name: 'PM2.5', color: '#e8a87c', unit: 'μg/m³', field: 'pm25' },
            hcho: { name: '甲醛', color: '#c06c84', unit: 'mg/m³', field: 'hcho' }
        };

        function initChart() {
            chart = echarts.init(document.getElementById('chart'));
            window.onresize = function () { chart.resize(); };
            updateChart();
        }

        function updateChart() {
            if (!chart) return;
            var cfg = metricConfig[currentMetric];

            var times = historyData.map(function (d) {
                return d.time_str.substring(11);
            });
            var values = historyData.map(function (d) {
                return d[cfg.field];
            });

            chart.setOption({
                grid: { top: 45, bottom: 5, left: 40, right: 18, containLabel: true },
                tooltip: {
                    trigger: 'axis',
                    axisPointer: { type: 'line' }
                },
                xAxis: [{
                    type: 'category',
                    boundaryGap: false,
                    axisLabel: {
                        formatter: '{value}',
                        fontSize: 10,
                        color: '#bfbfbf'
                    },
                    axisLine: { lineStyle: { color: '#e9e9e9' } },
                    splitLine: { show: true, lineStyle: { color: '#f7f7f7' } },
                    axisTick: { show: false },
                    data: times
                }],
                yAxis: [{
                    boundaryGap: false,
                    type: 'value',
                    axisLabel: { color: '#bfbfbf', formatter: '{value}' },
                    splitLine: { lineStyle: { color: '#e2e2e2' } },
                    axisLine: { show: false, lineStyle: { color: '#e9e9e9' } },
                    axisTick: { show: false }
                }],
                series: [{
                    name: cfg.name,
                    type: 'line',
                    smooth: true,
                    showSymbol: false,
                    symbolSize: 5,
                    itemStyle: { color: cfg.color },
                    lineStyle: { normal: { width: 2, color: cfg.color } },
                    areaStyle: {
                        normal: {
                            color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
                                { offset: 0, color: cfg.color },
                                { offset: 0.8, color: '#f6f6f8' }
                            ])
                        }
                    },
                    data: values
                }]
            });
        }

        function switchMetric(metric) {
            currentMetric = metric;
            document.querySelectorAll('.chart .type span').forEach(function (el) {
                el.classList.remove('on');
            });
            var tabMap = { temperature: 'tab_temp', humidity: 'tab_hum', pm25: 'tab_pm25', hcho: 'tab_hcho' };
            var tab = document.getElementById(tabMap[metric]);
            if (tab) tab.classList.add('on');
            updateChart();
        }

        function loadHistory(hours) {
            currentHours = hours;
            document.querySelectorAll('.range-selector button').forEach(function (el) {
                el.classList.remove('active');
            });
            var btn = document.querySelector('.range-selector button[data-hours="' + hours + '"]');
            if (btn) btn.classList.add('active');

            $.ajax({
                type: 'GET',
                url: '/api/history?hours=' + hours,
                dataType: 'json',
                success: function (resp) {
                    if (resp.success && resp.data) {
                        historyData = resp.data;
                        updateChart();
                    }
                },
                error: function () {
                    console.error('Failed to load history data');
                }
            });
        }

        function setBrightness(value) {
            $.ajax({
                type: 'POST',
                url: '/api/brightness',
                contentType: 'application/json',
                data: JSON.stringify({ value: value }),
                success: function (resp) {
                    if (resp.success) {
                        document.querySelectorAll('.brightness-buttons button').forEach(function (el) {
                            el.classList.remove('active');
                        });
                        var btn = document.getElementById('btn_bright_' + value);
                        if (btn) btn.classList.add('active');
                    }
                },
                error: function () {
                    alert('设置亮度失败');
                }
            });
        }

        function refreshData() {
            $.ajax({
                type: 'GET',
                url: '/getdata',
                dataType: 'json',
                success: function (m1data) {
                    if (m1data.success === false) return;
                    $("#info_time").text(m1data.info_time);
                    $("#info_humidity").text(m1data.info_humidity);
                    $("#info_temperature").text(m1data.info_temperature);
                    $("#info_pm25").text(m1data.info_pm25);
                    $("#info_hcho").text(m1data.info_hcho);
                }
            });
        }

        $(document).ready(function () {
            initChart();
            loadHistory(24);
            setInterval(refreshData, 5000);
        });
    </script>
</body>
</html>
